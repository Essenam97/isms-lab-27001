# Nextcloud for the Lagune Payroll ISMS lab (actions A07 and A13).
# SQLite database, installed automatically at first start. Not a production
# setup: production would use HTTPS, an external database and Redis.

services:
  nextcloud:
    image: nextcloud:31-apache
    container_name: lagune-nextcloud
    environment:
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_ADMIN_USER: ${NC_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NC_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: localhost
    ports:
      - "8081:80"
    mem_limit: 1g
    restart: unless-stopped
