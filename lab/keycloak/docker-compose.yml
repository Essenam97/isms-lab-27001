# Keycloak for the Lagune Payroll ISMS lab (action A04).
# Design file: written and reviewed, not yet run (see README.md in this folder).
# Development mode with the embedded H2 database, to fit a small lab machine.
# Not suitable for production: production would use start (not start-dev),
# HTTPS and an external PostgreSQL database.

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: lagune-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      - ./realm-lagune.json:/opt/keycloak/data/import/realm-lagune.json:ro
    mem_limit: 768m
    restart: unless-stopped
